[package]
name = "cloth-app"
description = "Aplicação desktop do ClothEvo (Fase 0: protótipo do simulador XPBD)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clothevo"
path = "src/main.rs"

[dependencies]
cloth-sim = { path = "../cloth-sim" }
cloth-render = { path = "../cloth-render" }
pattern-core = { path = "../pattern-core" }
pattern-geom = { path = "../pattern-geom" }
pattern-mesh = { path = "../pattern-mesh" }
glam = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17.2"
ufbx = "0.11.5"
