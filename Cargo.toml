[workspace]
resolver = "2"
members = ["crates/cloth-sim", "crates/cloth-render", "crates/cloth-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
glam = { version = "0.34", features = ["bytemuck"] }
rayon = "1.10"
bytemuck = { version = "1", features = ["derive"] }

# Em debug o solver precisa ser rápido o bastante para ser usável.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.cloth-sim]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
