name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - name: Test workspace
        run: cargo test --workspace
      - name: Check application
        run: cargo check -p cloth-app

  build-windows:
    # O commit de código já passou no Rust CI #153; construa em paralelo para
    # disponibilizar o binário mesmo se uma repetição do job de teste ficar lenta.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ClothEvo release executable
        run: cargo build --release -p cloth-app
      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: clothevo-windows-x64
          path: target/release/clothevo.exe
          if-no-files-found: error
          retention-days: 14
